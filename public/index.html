<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    form { display: grid; gap: 12px; max-width: 420px; margin: 26px 0; }
    label { display: grid; gap: 6px; color: #bfd0e5; }
    input, button { box-sizing: border-box; padding: 11px 13px; border: 1px solid #51667c; border-radius: 8px; font: inherit; }
    input { color: #101a28; }
    button { width: fit-content; color: #ecf4ff; background: #245c72; cursor: pointer; }
    #status { min-height: 1.5em; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 자료실</div>
    <h1>보호된 자료실</h1>
    <p>로그인 후 서버를 통해 본인에게 허용된 자료만 확인할 수 있습니다.</p>
    <form id="login-form" autocomplete="on">
      <label for="email">이메일
        <input id="email" name="email" type="email" autocomplete="username" required>
      </label>
      <label for="password">비밀번호
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <button id="login-button" type="submit">로그인</button>
    </form>
    <button id="logout-button" type="button" hidden>로그아웃</button>
    <p id="status" role="status" aria-live="polite">로그인 상태를 확인하는 중입니다.</p>
    <ul id="notes" aria-live="polite" hidden></ul>
  </main>
  <script type="module">
    const form = document.querySelector('#login-form');
    const email = document.querySelector('#email');
    const password = document.querySelector('#password');
    const loginButton = document.querySelector('#login-button');
    const logoutButton = document.querySelector('#logout-button');
    const list = document.querySelector('#notes');

    async function request(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        cache: 'no-store',
        credentials: 'same-origin',
      });
      let payload = null;
      try {
        payload = await response.json();
      } catch {
        payload = null;
      }
      if (!response.ok) {
        const error = new Error(response.status === 401
          ? '로그인이 필요하거나 세션이 만료되었습니다.'
          : '요청을 처리하지 못했습니다.');
        error.status = response.status;
        throw error;
      }
      return payload;
    }

    function renderNotes(notes) {
      if (!Array.isArray(notes)) throw new Error('자료 형식이 맞지 않습니다.');
      list.replaceChildren(...notes.map(note => {
        const item = document.createElement('li');
        const title = document.createElement('strong');
        const content = document.createElement('span');
        title.textContent = note.title;
        content.textContent = note.body;
        item.append(title, content);
        return item;
      }));
      list.hidden = false;
    }

    async function loadNotes() {
      const data = await request('/api/notes');
      renderNotes(data.notes);
    }

    async function checkSession() {
      try {
        const session = await request('/api/auth/session');
        if (session?.authenticated !== true) throw new Error('세션을 확인할 수 없습니다.');
        form.hidden = true;
        logoutButton.hidden = false;
        await loadNotes();
        document.querySelector('#status').textContent = '로그인되었습니다.';
      } catch (error) {
        form.hidden = false;
        logoutButton.hidden = true;
        list.hidden = true;
        list.replaceChildren();
        document.querySelector('#status').textContent = error.status === 401
          ? '로그인해 주세요.'
          : '로그인 상태를 확인하지 못했습니다. 잠시 후 다시 시도해 주세요.';
      }
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      loginButton.disabled = true;
      document.querySelector('#status').textContent = '로그인 중입니다.';
      try {
        await request('/api/auth/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ email: email.value.trim(), password: password.value }),
        });
        password.value = '';
        await checkSession();
      } catch (error) {
        document.querySelector('#status').textContent = error.status === 401
          ? '이메일 또는 비밀번호를 확인해 주세요.'
          : '로그인 요청을 처리하지 못했습니다.';
      } finally {
        loginButton.disabled = false;
      }
    });

    logoutButton.addEventListener('click', async () => {
      logoutButton.disabled = true;
      let logoutFailed = false;
      try {
        await request('/api/auth/logout', { method: 'POST' });
      } catch {
        logoutFailed = true;
      } finally {
        password.value = '';
        logoutButton.disabled = false;
      }
      await checkSession();
      if (logoutFailed) {
        document.querySelector('#status').textContent =
          '로그아웃 서버 응답을 확인하지 못했습니다. 세션 상태를 다시 확인해 주세요.';
      }
    });

    await checkSession();
  </script>
</body>
</html>
