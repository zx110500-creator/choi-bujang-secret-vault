<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a28">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    form { display: grid; gap: 12px; max-width: 420px; margin: 26px 0; }
    label { display: grid; gap: 6px; color: #bfd0e5; }
    input, button { box-sizing: border-box; padding: 11px 13px; border: 1px solid #51667c; border-radius: 8px; font: inherit; }
    input { color: #101a28; }
    button { width: fit-content; color: #ecf4ff; background: #245c72; cursor: pointer; }
    #status { min-height: 1.5em; }
    #offline-status { color: #ffd28a; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 자료실</div>
    <h1>보호된 자료실</h1>
    <p>로그인 후 서버를 통해 본인에게 허용된 자료만 확인할 수 있습니다.</p>
    <form id="login-form" autocomplete="on">
      <label for="email">이메일
        <input id="email" name="email" type="email" autocomplete="username" required>
      </label>
      <label for="password">비밀번호
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <button id="login-button" type="submit">로그인</button>
    </form>
    <button id="logout-button" type="button" hidden>로그아웃</button>
    <p id="status" role="status" aria-live="polite">로그인 상태를 확인하는 중입니다.</p>
    <button id="device-approval-button" type="button" hidden>기기 승인 요청</button>
    <p id="offline-status" role="status" aria-live="polite" hidden>
      오프라인 상태입니다. 연결이 복구되면 서버에서 승인 상태를 다시 확인해 주세요.
    </p>
    <section id="protected-content" aria-labelledby="notes-heading" hidden>
      <h2 id="notes-heading">내 자료</h2>
      <ul id="notes" aria-live="polite"></ul>
    </section>
  </main>
  <script type="module">
    const form = document.querySelector('#login-form');
    const email = document.querySelector('#email');
    const password = document.querySelector('#password');
    const loginButton = document.querySelector('#login-button');
    const logoutButton = document.querySelector('#logout-button');
    const approvalButton = document.querySelector('#device-approval-button');
    const protectedContent = document.querySelector('#protected-content');
    const list = document.querySelector('#notes');
    const status = document.querySelector('#status');
    const offlineStatus = document.querySelector('#offline-status');

    async function request(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        cache: 'no-store',
        credentials: 'same-origin',
      });
      let payload = null;
      try {
        payload = await response.json();
      } catch {
        payload = null;
      }
      if (!response.ok) {
        const error = new Error(response.status === 401
          ? '로그인이 필요하거나 세션이 만료되었습니다.'
          : response.status === 403
            ? '이 기기는 아직 승인되지 않았습니다.'
          : '요청을 처리하지 못했습니다.');
        error.status = response.status;
        throw error;
      }
      return payload;
    }

    function renderNotes(notes) {
      if (!Array.isArray(notes)) throw new Error('자료 형식이 맞지 않습니다.');
      list.replaceChildren(...notes.map(note => {
        const item = document.createElement('li');
        const title = document.createElement('strong');
        const content = document.createElement('span');
        title.textContent = note.title;
        content.textContent = note.body;
        item.append(title, content);
        return item;
      }));
      protectedContent.hidden = false;
    }

    function closeProtectedContent() {
      protectedContent.hidden = true;
      list.replaceChildren();
    }

    async function loadNotes() {
      const data = await request('/api/notes');
      renderNotes(data.notes);
    }

    async function checkSession() {
      closeProtectedContent();
      approvalButton.hidden = true;
      try {
        const session = await request('/api/auth/session');
        if (session?.authenticated !== true) throw new Error('세션을 확인할 수 없습니다.');
        form.hidden = true;
        logoutButton.hidden = false;
        const approval = await request('/api/device-approval');
        if (approval?.status !== 'approved') {
          approvalButton.hidden = approval?.status !== 'not_requested';
          status.textContent = approval?.status === 'pending'
            ? '기기 승인 요청을 보냈습니다. 운영자 승인을 기다려 주세요.'
            : approval?.status === 'revoked'
              ? '이 기기의 승인이 회수되었습니다. 운영자에게 문의해 주세요.'
              : '이 기기는 승인되지 않았습니다. 자료를 열려면 먼저 기기 승인이 필요합니다.';
          return;
        }
        await loadNotes();
        status.textContent = '로그인 및 기기 승인이 확인되었습니다.';
      } catch (error) {
        form.hidden = false;
        logoutButton.hidden = true;
        approvalButton.hidden = true;
        closeProtectedContent();
        status.textContent = error.status === 401
          ? '로그인해 주세요.'
          : '로그인 상태를 확인하지 못했습니다. 잠시 후 다시 시도해 주세요.';
      }
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      loginButton.disabled = true;
      status.textContent = '로그인 중입니다.';
      try {
        await request('/api/auth/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ email: email.value.trim(), password: password.value }),
        });
        password.value = '';
        await checkSession();
      } catch (error) {
        status.textContent = error.status === 401
          ? '이메일 또는 비밀번호를 확인해 주세요.'
          : '로그인 요청을 처리하지 못했습니다.';
      } finally {
        loginButton.disabled = false;
      }
    });

    approvalButton.addEventListener('click', async () => {
      approvalButton.disabled = true;
      status.textContent = '기기 승인 요청을 보내는 중입니다.';
      try {
        await request('/api/device-approval', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: '{}',
        });
        approvalButton.hidden = true;
        status.textContent = '승인 요청을 접수했습니다. 운영자 승인 후 다시 접속해 주세요.';
      } catch {
        status.textContent = '기기 승인 요청을 보내지 못했습니다. 연결 상태를 확인해 주세요.';
      } finally {
        approvalButton.disabled = false;
      }
    });

    logoutButton.addEventListener('click', async () => {
      logoutButton.disabled = true;
      let logoutFailed = false;
      try {
        await request('/api/auth/logout', { method: 'POST' });
      } catch {
        logoutFailed = true;
      } finally {
        password.value = '';
        logoutButton.disabled = false;
      }
      await checkSession();
      if (logoutFailed) {
        status.textContent =
          '로그아웃 서버 응답을 확인하지 못했습니다. 세션 상태를 다시 확인해 주세요.';
      }
    });

    function updateOfflineStatus() {
      offlineStatus.hidden = navigator.onLine;
    }
    window.addEventListener('online', updateOfflineStatus);
    window.addEventListener('offline', updateOfflineStatus);
    updateOfflineStatus();

    await checkSession();
  </script>
</body>
</html>
